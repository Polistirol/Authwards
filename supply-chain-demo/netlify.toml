[build]
  # Install from monorepo root so `node_modules` is hoisted to ../ — TypeScript resolves `react` / wallet packages from `../sdk` sources.
  command = "cd .. && npm install && cd supply-chain-demo && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# :splat in the function *path* breaks routing. Pass the tail as a query param so the single `api` handler sees /shipments/...
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?path=:splat"
  status = 200
  force = true

# Optional: `npx netlify dev` proxies Vite. For day-to-day local API testing, `npm run dev` alone is enough — /api is handled by Vite middleware (server/traceflow-vite.ts).
[dev]
  command = "npm run dev"
  targetPort = 5175
  port = 8888
